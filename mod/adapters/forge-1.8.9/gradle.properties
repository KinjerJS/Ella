# Deobfuscating the 1.8.9 jar holds the whole class set in memory at once. Gradle 2.14's
# default heap is far too small for it and the build dies with "GC overhead limit
# exceeded" partway through `deobfMcMCP`.
org.gradle.jvmargs=-Xmx3G

# Deliberately not setting org.gradle.java.home: this build needs a Java 8 JVM, but the
# path to one differs per machine. Pass it at the command line instead —
# `./gradlew build -Dorg.gradle.java.home=/path/to/jdk-8` — or export JAVA_HOME.
