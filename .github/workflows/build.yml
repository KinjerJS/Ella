name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  # Pinned to the version the adapters are known to build under. RetroFuturaGradle and
  # ForgeGradle are both sensitive to the Gradle version, and the runner image's default
  # changes without warning.
  GRADLE_VERSION: '8.2.1'
  # Gradle finds toolchain JDKs through these variables, which setup-java exports. Without
  # it the Java 8 toolchain the adapters ask for is simply "not found".
  TOOLCHAINS: '-Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64'

jobs:
  launcher:
    name: Launcher — typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - run: npm ci
        working-directory: launcher

      - run: npm run typecheck
        working-directory: launcher

      # The tests run the TypeScript sources directly through Node's type stripping, so
      # there is no build step in front of them.
      - run: npm test
        working-directory: launcher

  core:
    name: ella-core — tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Compiled against 8 (the oldest adapter's runtime), tested on 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - run: gradle test ${{ env.TOOLCHAINS }}
        working-directory: mod/ella-core

  adapters:
    name: Forge adapters
    runs-on: ubuntu-latest
    # The first run decompiles Minecraft from scratch for the 1.12.2 toolchain, which is
    # slow. Later runs hit the Gradle cache and finish in a few minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # Each adapter names the JVM its daemon must run on, rather than inheriting whatever
      # setup-java left in JAVA_HOME: RetroFuturaGradle and ForgeGradle run game tooling
      # inside the Gradle process itself, so the daemon's JVM is part of the build
      # definition. `-D` on the command line overrides the project's gradle.properties.
      # The odd one out: RetroFuturaGradle covers only 1.7.10 and 1.12.2, so 1.8.9 has to
      # use the era-correct ForgeGradle 2.1 — which needs Gradle 2.14 on Java 8. That is
      # why this adapter carries its own wrapper and ignores the pinned Gradle above.
      - name: Build forge-1.8.9
        working-directory: mod/adapters/forge-1.8.9
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_8_X64 }}
        run: ./gradlew build --no-daemon

      - name: Build forge-1.12.2
        working-directory: mod/adapters/forge-1.12.2
        run: gradle build ${{ env.TOOLCHAINS }} -Dorg.gradle.java.home=$JAVA_HOME_17_X64

      - name: Build forge-modern
        working-directory: mod/adapters/forge-modern
        run: gradle build ${{ env.TOOLCHAINS }} -Dorg.gradle.java.home=$JAVA_HOME_21_X64

      # Uploaded already laid out the way the packaged app expects, so the packaging jobs can
      # drop the artifact straight into place instead of re-deriving Gradle paths.
      - name: Stage jars for packaging
        working-directory: launcher
        run: node scripts/stage-adapters.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: adapters
          path: launcher/resources/adapters
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    needs: [launcher, adapters]
    # Packaging is deterministic once the two jobs above pass, so pull requests skip it
    # and only branch pushes, tags and manual runs produce installers.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - run: npm ci
        working-directory: launcher

      - uses: actions/download-artifact@v4
        with:
          name: adapters
          path: launcher/resources/adapters

      - run: npm run build
        working-directory: launcher

      - run: npm run icon
        working-directory: launcher

      # electron-builder is invoked directly rather than through `npm run dist`, whose
      # pre-step would re-stage the adapters from a Gradle output this runner does not have.
      - name: Package
        working-directory: launcher
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ella-windows
          path: |
            launcher/release/*.exe
            launcher/release/*.exe.blockmap
          if-no-files-found: error

  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    needs: [launcher, adapters]
    # Same rule as the Windows job: pull requests stop at the checks above.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - run: npm ci
        working-directory: launcher

      - uses: actions/download-artifact@v4
        with:
          name: adapters
          path: launcher/resources/adapters

      - run: npm run build
        working-directory: launcher

      # Draws build/icon.png as well as the .ico; the Linux target only reads the PNG.
      - run: npm run icon
        working-directory: launcher

      # Called directly for the same reason as on Windows: `npm run dist:linux` would try to
      # re-stage the adapters from Gradle output that only exists in the adapters job.
      - name: Package
        working-directory: launcher
        run: npx electron-builder --linux --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ella-linux
          path: launcher/release/*.AppImage
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Both platforms' packages land side by side in one folder.
      - uses: actions/download-artifact@v4
        with:
          pattern: ella-*
          path: release
          merge-multiple: true

      # The Blockbench plugin ships with the release: it is a single file the user drops
      # into Blockbench, and pointing them at a raw file in the repository is worse.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Ella ${GITHUB_REF_NAME}" \
            --generate-notes \
            release/*.exe \
            release/*.AppImage \
            blockbench-plugin/ella_live_sync.js
